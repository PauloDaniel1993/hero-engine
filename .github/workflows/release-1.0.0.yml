name: Publish Hero Engine 1.0.5

on:
  push:
    branches: [feat/thargunn-mythic-addon]
    paths:
      - .github/workflows/release-1.0.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test -- --run
      - run: npm run build
      - name: Package module
        run: |
          cd dist
          zip -Xqr ../hero-engine.zip .
      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.5 >/dev/null 2>&1; then
            gh release upload v1.0.5 dist/module.json#module.json hero-engine.zip#hero-engine.zip --clobber
          else
            gh release create v1.0.5 --target "$GITHUB_SHA" --title "Hero Engine 1.0.5 — Canonical Echo Repair" --notes-file CHANGELOG.md dist/module.json#module.json hero-engine.zip#hero-engine.zip
          fi
